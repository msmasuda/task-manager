name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reservation_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d reservation_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reservation_manager
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/reservation_manager
      AUTH_SECRET: ci-auth-secret-that-is-at-least-32-characters
      TOKEN_HASH_SECRET: ci-token-secret-that-is-at-least-32-characters
      APP_URL: http://127.0.0.1:3000
      EMAIL_FROM: Reservation Manager <noreply@example.com>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
