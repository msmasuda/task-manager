services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - reservation-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reservation-manager-postgres:
